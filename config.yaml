# Vylla Social Autopilot settings. Edit this file to change what gets posted.

agent:
  name: Jaskaran Singh
  title: REALTOR®
  license: RES.0820095
  brokerage: Vylla Home          # CT law: brokerage name must appear in every ad
  phone: (475) 400-0661          # matches Google Business Profile. Website uses (203) 266-3555; pick one and use it everywhere
  website: jaskaranrealtor.com
  languages: [English, Hindi, Punjabi, Urdu]
  smart_mls_agent_id: ""         # your Smart MLS agent ID; only listings with this ID are auto-posted

# Appended to every caption by the compliance step.
disclosure: "Jaskaran Singh, REALTOR® | Brokered by Vylla Home | CT Lic# RES.0820095 | Call/Text (475) 400-0661 | jaskaranrealtor.com | English · Hindi · Punjabi · Urdu | Equal Housing Opportunity"

# Posts rotate through these towns, one per post day. Add or remove towns freely.
regions:
  Greater Danbury area:
    - Newtown
    - Danbury
    - New Milford
    - Ridgefield
    - Bethel
    - Southbury
    - Brookfield
    - Sandy Hook
    - Wilton

brand:
  charcoal: "#31313B"
  new_day: "#FFB000"
  cream: "#F9F5F2"
  grey: "#626267"
  greenery: "#6ABE66"

gemini:
  model: gemini-flash-latest     # free tier covers daily use; change if Google renames models

# Spoken voiceover on the short videos (Gemini text-to-speech, same API key).
voiceover:
  enabled: true
  voice: Charon                  # other male voices: Orus, Fenrir, Iapetus. Female: Kore, Aoede, Leda
  style: "Say in a warm, confident, conversational tone, at a natural pace:"

# Background music: drop royalty-free tracks (mp3/m4a/wav) into assets/music/. They rotate by day.
music:
  volume: 0.15                   # under the voiceover; music-only videos play louder automatically

# One theme per weekday (0 = Monday). Themes are defined in autopilot/themes.py.
calendar:
  0: market_update
  1: town_spotlight
  2: listing_spotlight           # falls back to buyer_tip when you have no active listing
  3: seller_tip
  4: town_spotlight
  5: buyer_tip
  6: community_life

# How posts reach your accounts:
#   metricool  - each week, build a CSV you import into Metricool (free plan)
#   dryrun / zernio / ayrshare - daily posting through the Zernio or Ayrshare API
publisher: metricool

metricool:
  monthly_post_limit: 20         # Metricool free plan
  # How Metricool counts a post sent to several networks. Check in your account:
  # schedule one post to 2 networks and see whether the remaining count drops by 1 or 2.
  count_mode: per_row            # per_row | per_network
  import_as_draft: true          # true = posts land as drafts you confirm in Metricool
  # Weekday (0 = Monday) -> networks. Each line becomes one Metricool post.
  # Video days post a 10-second vertical video (Reel on Instagram, Short on YouTube).
  # Google Business Profile does not take video, so it gets the image on its own day.
  # About 17-20 posts a month with per_row counting; the exporter never goes over the limit.
  schedule:
    0: [facebook, instagram, tiktok, youtube]
    1: [gmb]
    2: [facebook, instagram, tiktok, youtube]
    4: [facebook, instagram, tiktok, youtube]
  # Public web address where post images and videos are hosted (GitHub Pages, see README).
  media_base_url: https://singhjre-ops.github.io/vylla-social-autopilot/media

# Platforms for the Zernio / Ayrshare daily mode. TikTok and YouTube get the video; the rest get the image.
platforms:
  - facebook
  - instagram
  - gmb                          # Google Business Profile
  - tiktok
  - youtube
approval_required: true          # false = post without waiting for approval
post_time_local: "10:00"         # America/New_York
timezone: America/New_York
