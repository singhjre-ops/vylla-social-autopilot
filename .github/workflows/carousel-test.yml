name: Carousel test (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium >/dev/null
      - name: Generate three carousels with Gemini (nothing is committed or posted)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import date
          from autopilot.config import load_config, load_env
          from autopilot import main
          load_env(); cfg = load_config()
          for d in (date(2026, 11, 9), date(2026, 11, 11), date(2026, 11, 13)):
              main.generate_carousel(cfg, d)
          PY
      - name: Push results to a scratch branch
        run: |
          git config user.name autopilot; git config user.email autopilot@users.noreply.github.com
          git checkout -b carousel-test
          git add -f queue/2026-11-1*
          git commit -qm "carousel test output" && git push -f origin carousel-test
