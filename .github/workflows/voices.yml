name: Voice notes

# Picks up the voice notes you send to the Telegram bot and rebuilds those videos with your voice.
# Runs every 20 minutes from Saturday through Monday morning (UTC), or on demand.
on:
  schedule:
    - cron: "*/20 * * * 6,0"
    - cron: "*/20 0-5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency: autopilot

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: pip install -r requirements.txt
      - name: Process voice notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m autopilot.main voices
      - name: Save rebuilt videos
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A queue docs data
          git diff --cached --quiet || (git commit -m "autopilot: your voice" && git pull --rebase && git push)
