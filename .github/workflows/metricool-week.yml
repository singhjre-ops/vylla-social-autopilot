name: Metricool weekly batch

# Every Saturday, build next week's posts and a Metricool CSV.
# Images and videos are published through GitHub Pages (the docs/ folder) so Metricool can fetch them.
# If Saturday's run fails (for example Gemini is overloaded), Sunday's run tries again.
# Either way, a failure sends you a Telegram message, so a missing week is never silent.
on:
  schedule:
    - cron: "0 13 * * 6"        # Saturday 9 AM ET (8 AM in winter)
    - cron: "0 14 * * 0"        # Sunday backup: only runs if Saturday's file is missing
  workflow_dispatch:

permissions:
  contents: write

concurrency: autopilot

jobs:
  week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this week's file already exists
        id: check
        run: |
          next_monday=$(date -u -d "next monday" +%F)
          echo "week=$next_monday" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "exports/metricool-week-$next_monday.csv" ]; then
            echo "Week of $next_monday already built; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.skip != 'true'
        run: sudo apt-get install -y ffmpeg >/dev/null
      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - if: steps.check.outputs.skip != 'true'
        run: python -m playwright install --with-deps chromium >/dev/null
      - name: Build week
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m autopilot.main week
      - name: Save posts, media and CSV
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A queue docs exports data
          git diff --cached --quiet || (git commit -m "autopilot: Metricool week" && git push)
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: metricool-csv
          path: exports/
      - name: Tell Jaskaran it failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(date -u +%u)" = "6" ]; then retry="It will try again automatically on Sunday at 9 AM."; else retry="Ask Claude to look at it, or re-run it from GitHub Actions."; fi
          msg="⚠️ The weekly post batch for the week of ${{ steps.check.outputs.week }} failed. $retry Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${msg}" >/dev/null
